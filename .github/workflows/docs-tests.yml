name: Docs tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'tests/fixtures/docs/**'
      - 'tests/bats/docs/**'
      - 'tests/docs/**'
      - 'bin/test/docs.bash'
      - '.github/workflows/docs-tests.yml'

jobs:
  docs:
    name: Documentation example tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('pdm.lock') }}
      - name: Install PDM
        run: pip install pdm
      - name: Run documentation example tests
        env:
          PLCC_NO_TEST_CACHE: "1"
        run: bin/test/docs.bash
      - name: Build docs strictly
        run: pdm run mkdocs build --strict
